<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Linear Search Animation by Sumera Jabeen</title>
<style>
:root{--bg:#f7f7fb;--fg:#1d1d2b;--card:#fff;--bd:#c9cbe0;--acc:#4f46e5;--ok:#16a34a;--no:#dc2626;--mut:#6b6f85;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14151f;--fg:#ececf5;--card:#1e2030;--bd:#3a3d57;--acc:#8b86ff;--ok:#4ade80;--no:#f87171;--mut:#9a9ebb}}
:root[data-theme="dark"]{--bg:#14151f;--fg:#ececf5;--card:#1e2030;--bd:#3a3d57;--acc:#8b86ff;--ok:#4ade80;--no:#f87171;--mut:#9a9ebb}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:820px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem;margin:0 0 4px}
.by{color:var(--mut);margin:0 0 16px}
.use{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;line-height:1.5}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
input{width:90px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);font-size:1rem}
button{padding:8px 16px;border:0;border-radius:8px;background:var(--acc);color:#fff;font-size:1rem;cursor:pointer}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
button:disabled{opacity:.5;cursor:default}
.wrap{overflow-x:auto;padding:8px 0 4px}
.row{display:flex;gap:6px;min-width:max-content}
.cell{width:52px;text-align:center}
.arrow{height:22px;color:var(--acc);font-weight:700}
.box{height:48px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bd);border-radius:8px;background:var(--card);font-weight:600}
.idx{font-size:.75rem;color:var(--mut);margin-top:2px}
.cell.cur .box{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,var(--card))}
.cell.miss .box{border-color:var(--no);color:var(--no)}
.cell.hit .box{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 20%,var(--card));color:var(--ok)}
#msg{margin-top:14px;min-height:1.6em;font-weight:600}
.i{color:var(--mut);margin-top:6px}
</style>
</head>
<body>
<main>
<h1>Linear Search Animation</h1>
<p class="by">by Sumera Jabeen</p>
<div class="use"><b>Usage:</b> Enter a key as a number. Click <b>Step</b> to perform one comparison. Click <b>Reset</b> to start over with a new random list of integers. You may enter a new key for a new search.</div>
<div class="ctl">
<label for="key">Key:</label><input id="key" type="number" placeholder="e.g. 42">
<button id="step">Step</button><button id="reset" class="sec">Reset</button>
</div>
<div class="wrap"><div id="list" class="row"></div></div>
<div class="i" id="i">i: –</div>
<div id="msg" aria-live="polite"></div>
</main>
<script>
(function(){
var N=10,a=[],i=-1,done=false,lastKey=null;
var list=document.getElementById('list'),msg=document.getElementById('msg'),iEl=document.getElementById('i'),keyEl=document.getElementById('key');
function rnd(){a=[];for(var k=0;k<N;k++)a.push(Math.floor(Math.random()*100));}
function state(){return{i:i};}
function render(found){
list.innerHTML='';
a.forEach(function(v,k){
var c=document.createElement('div');c.className='cell';
if(i>=0&&k<i)c.classList.add('miss');
if(k===i)c.classList.add(found?'hit':'cur');
c.innerHTML='<div class="arrow">'+(k===i?'↓':'')+'</div><div class="box">'+v+'</div><div class="idx">'+k+'</div>';
list.appendChild(c);
});
iEl.textContent='i: '+(i<0?'–':i);
}
function reset(){rnd();i=-1;done=false;lastKey=null;render();msg.textContent='A list is filled with random numbers.';}
function step(){
var raw=keyEl.value.trim();
if(raw===''){msg.textContent='Please enter a key first.';return;}
var key=Number(raw);
if(lastKey!==key){i=-1;done=false;lastKey=key;}
if(done){msg.textContent='Search finished. Change the key or press Reset.';return;}
i++;
if(i>=N){i=N;done=true;render();msg.textContent='Key '+key+' is not in the list (not found, returns -1).';return;}
if(a[i]===key){done=true;render(true);msg.textContent='Found '+key+' at index '+i+'.';return;}
render();
msg.textContent='a['+i+'] = '+a[i]+' ≠ '+key+'. Keep going.';
}
document.getElementById('step').onclick=step;
document.getElementById('reset').onclick=reset;
keyEl.addEventListener('keydown',function(e){if(e.key==='Enter')step();});
reset();
})();
</script>
</body>
</html>
